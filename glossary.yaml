# The concept ledger for "Prompt to Ledger".
#
# This is the book's canon: every piece of jargon it teaches, the ONE definition
# it commits to, and the ONE analogy it uses for that idea throughout. Chapters
# are written against this file; `make check` lints the manuscript against it.
#
# Structurally identical to prompt-to-production's and prompt-to-evidence's
# glossary.yaml — same tooling, same discipline, different subject.
#
#   term        the canonical name
#   aka         synonyms and near-misses the reader will meet elsewhere
#   definition  the one plain-language definition (used verbatim in the glossary)
#   analogy     the metaphor this book commits to and never contradicts
#   depends_on  terms that must already be defined for this one to make sense
#   defined_in  the chapter that introduces it

kind: technical
title: "Prompt to Ledger"

# Chapter 14 teaches how to ask rather than a word to ask it with -- what a
# complete request contains, and when the honest answer is to bring in a real professional.
# Chapter 15 is the closing checklist and 16 the afterword: both recap the
# book's vocabulary rather than extend it, so neither introduces a term.
teaches_no_terms: [14, 15, 16]

concepts:

  # ─── Chapter 1 — The Handoff ────────────────────────────────────────────
  - term: "forecast"
    scan: true
    definition: >-
      A number projected forward by a financial model, built from
      assumptions. Not, by itself, something you can act on.
    analogy: "A weather forecast, not a weather report."
    defined_in: 1

  - term: "assumption"
    scan: true
    definition: >-
      An input a model treats as true, whether or not anyone checked it.
    analogy: "The fine print on a warranty: unread until the thing breaks."
    depends_on: ["forecast"]
    defined_in: 1

  # ─── Chapter 2 — Where the Money Actually Lives ─────────────────────────
  - term: "cash accounting"
    definition: >-
      Counting a transaction when money actually moves — a sale recorded
      when the customer pays, a bill recorded when it's settled.
    analogy: "Counting the money as it crosses the counter."
    defined_in: 2

  - term: "accrual accounting"
    definition: >-
      Counting a transaction when it's earned or incurred, regardless of
      when cash moves — a sale recorded the moment it's delivered, whether
      or not the invoice has been paid yet.
    analogy: "Counting the sale as the goods leave the shop, whoever pays later."
    depends_on: ["cash accounting"]
    defined_in: 2

  - term: "income statement"
    aka: ["P&L", "profit and loss statement"]
    definition: >-
      A report of whether a period's activity made money — revenue earned
      minus the costs of earning it, over a period of time, built on
      accrual accounting.
    analogy: "The video of the quarter — the balance sheet is the photograph."
    depends_on: ["accrual accounting"]
    defined_in: 2

  - term: "balance sheet"
    definition: >-
      A report of what a business owns and owes at a single instant, like a
      photograph rather than a video — what it owns minus what it owes is
      what it's worth on paper at that moment.
    analogy: "A photograph of the business at one instant."
    defined_in: 2

  - term: "cash flow statement"
    definition: >-
      A report of how much actual cash moved and where it went, built by
      adjusting the income statement's accrual-basis profit back toward
      cash until what's left is the real change in the bank balance.
    analogy: "The bank statement, rebuilt from the books."
    depends_on: ["income statement", "cash accounting"]
    defined_in: 2

  # ─── Chapter 3 — The Shape of a Model ────────────────────────────────────
  - term: "financial model"
    definition: >-
      A set of assumptions connected by formulas to produce a forecast.
    analogy: "A row of assumptions wired together: pull one and the rest move."
    depends_on: ["assumption"]
    defined_in: 3

  - term: "input"
    definition: >-
      A number someone typed into a model because they believe it to be
      true, or expect it to become true. Nothing calculates an input; it is
      the model's opinion about the world, stated as a number.
    analogy: "The first domino, placed by hand."
    depends_on: ["financial model"]
    defined_in: 3

  - term: "formula"
    definition: >-
      A cell whose value is computed from other cells, ultimately tracing
      back to inputs.
    analogy: "A domino that falls because another one did."
    depends_on: ["input"]
    defined_in: 3

  # ─── Chapter 4 — Make It Compute, Not Guess ─────────────────────────────
  - term: "computation"
    definition: >-
      Arithmetic done by narration instead of by running an actual formula.
      The link in the chain where a confidently-stated number can simply be
      wrong, with nothing in the tone of the answer to say so.
    analogy: >-
      A calculator does not predict what 47 times 83 is; it computes it,
      tracking every digit the same way on the millionth calculation as on
      the first.
    depends_on: ["formula"]
    defined_in: 4
    # Not scanned: "computation" is ordinary English, and Chapter 1 uses it
    # while naming the chain. Hunting for it would cry wolf on the book's own
    # roadmap -- the exact false positive that teaches people to ignore a gate.
    scan: false

  # ─── Chapter 5 — The Tool, Not the Answer ───────────────────────────────
  - term: "parameter"
    scan: true
    definition: >-
      The part of a model that changes from one run to the next — a growth
      rate, a hiring plan, a price — kept separate from the formulas that
      stay fixed regardless of what value is supplied.
    analogy: "The date you type into the form, not the form."
    depends_on: ["input"]
    defined_in: 5

  # ─── Chapter 6 — Borrowed, Not Reinvented ───────────────────────────────
  - term: "gross margin"
    definition: >-
      Revenue minus the direct cost of delivering what was sold, divided by
      revenue.
    analogy: "What the bakery keeps on a loaf, before rent and wages."
    defined_in: 6

  - term: "customer acquisition cost"
    aka: ["CAC"]
    definition: >-
      Everything spent to acquire a customer over a period — marketing
      spend, sales salaries, tools — divided by the number of customers
      actually acquired in that period.
    analogy: "What the shop paid to get one person through the door."
    defined_in: 6

  - term: "churn rate"
    definition: >-
      The share of customers who cancel in a given period.
    analogy: "The share of the audience who leave before the interval."
    defined_in: 6

  - term: "lifetime value"
    aka: ["LTV"]
    definition: >-
      The total gross margin a customer generates over the whole time they
      stay a customer, estimated from margin per period and the average
      customer lifetime implied by the churn rate.
    analogy: "What that person spends in total before they stop coming back."
    depends_on: ["gross margin", "churn rate"]
    defined_in: 6

  # ─── Chapter 7 — Test It Against What You Already Know ──────────────────
  - term: "known-answer test"
    aka: ["sanity check"]
    definition: >-
      Running a model against a case where the correct result is already
      known, to check the model itself before trusting it on a case where
      the answer isn't.
    analogy: "Weighing a bag of sugar you know is a kilo, to test the scale."
    depends_on: ["parameter"]
    defined_in: 7

  - term: "consistency check"
    definition: >-
      Asking whether a forecast agrees with something else already known,
      arrived at a different way — a related number, an independent report,
      the surrounding trend. The scalable form of suspicion: run
      continuously on every forecast, not just the extreme-looking ones,
      without needing to re-derive anything from scratch.
    analogy: "Two witnesses who never met telling the same story."
    depends_on: ["known-answer test"]
    defined_in: 7

  # ─── Chapter 8 — Is This Assumption Doing All the Work? ─────────────────
  - term: "load-bearing assumption"
    definition: >-
      The input a model's conclusion is most sensitive to — the one where a
      modest, realistic change in the number produces a large change in the
      answer.
    analogy: "The wall you cannot take out without the roof coming down."
    depends_on: ["assumption"]
    defined_in: 8

  - term: "sensitivity analysis"
    definition: >-
      Changing one input at a time, holding everything else fixed, and
      watching how much the output moves — the technique for finding a
      model's load-bearing assumption.
    analogy: "Removing one wall at a time to find out which held the roof up."
    depends_on: ["load-bearing assumption"]
    defined_in: 8

  # ─── Chapter 9 — Cash Is Not Profit ──────────────────────────────────────
  - term: "burn rate"
    definition: >-
      How much cash a business spends beyond what it brings in, per month —
      costs minus revenue, on a cash basis.
    analogy: "How fast the tank is emptying."
    depends_on: ["cash accounting"]
    defined_in: 9

  - term: "runway"
    definition: >-
      How many months of cash remain at the current burn rate: cash in the
      bank, divided by monthly burn.
    analogy: "How much tarmac is left at the current speed."
    depends_on: ["burn rate"]
    defined_in: 9

  - term: "working capital"
    definition: >-
      Near-term assets (cash, money customers owe you) minus near-term
      liabilities (bills coming due soon), on the balance sheet. Moved
      month to month mainly by the timing gap between earning revenue and
      collecting it, or incurring a cost and paying it.
    analogy: "The float in the till: money you have, already spoken for."
    defined_in: 9

  # ─── Chapter 10 — Confidence, Not Certainty ─────────────────────────────
  - term: "point estimate"
    definition: >-
      The single best-guess number a forecast produces — real, and always a
      guess, computed from one particular set of assumptions that would
      come out slightly different with equally defensible ones.
    analogy: "One shot at a target, reported as though it were the bullseye."
    defined_in: 10

  - term: "scenario analysis"
    definition: >-
      Building more than one version of a forecast — typically a base case,
      a better case, and a worse case, each with its own internally
      consistent assumptions — rather than presenting one number as the
      only possible outcome.
    analogy: "Three routes drawn on the map, rather than one line."
    depends_on: ["point estimate"]
    defined_in: 10

  # ─── Chapter 11 — Whose Money Is It ──────────────────────────────────────
  - term: "equity"
    definition: >-
      A share of ownership in a company — a percentage entitling its holder
      to that share of whatever the company is eventually worth.
    analogy: "A slice of the pie, not a slice of the money."
    defined_in: 11

  # The book bolds all three separately in Chapter 11, and the distinction
  # between the two versions is the whole arithmetic of a term sheet, so they
  # are three concepts rather than one entry that mentions the other two.
  - term: "valuation"
    definition: >-
      What a company is said to be worth. It comes in two versions that
      matter for different reasons — see pre-money and post-money valuation.
    analogy: "The number on the price tag, not the number in the till."
    depends_on: ["equity"]
    defined_in: 11
    scan: true

  - term: "pre-money valuation"
    definition: >-
      What a company is worth before a new investment is added. The number
      an option pool is usually carved out of, which is why it decides how
      much a round actually dilutes the existing shareholders.
    analogy: "The size of the pie before the new slice is cut."
    depends_on: ["valuation"]
    defined_in: 11

  - term: "post-money valuation"
    definition: >-
      Pre-money plus the new cash — simply the pre-money valuation plus the
      investment amount, because the cash itself becomes part of what the
      company owns the moment it lands in the bank. A new investor's
      ownership share is their investment divided by this number.
    analogy: "The size of the pie after."
    depends_on: ["pre-money valuation"]
    defined_in: 11

  - term: "dilution"
    scan: true
    definition: >-
      The reduction in an existing shareholder's ownership percentage
      caused by new shares being issued to someone else.
    analogy: "The same amount of pie, a smaller share of it."
    depends_on: ["equity", "valuation"]
    defined_in: 11

  - term: "option pool"
    definition: >-
      A block of equity set aside, before a round is calculated, to grant
      to future employees as they're hired — usually carved out of the
      pre-money valuation, which means it dilutes existing shareholders,
      not the incoming investor.
    analogy: "A slice cut for guests who have not arrived, taken from the hosts' half."
    depends_on: ["valuation", "dilution"]
    defined_in: 11

  # ─── Chapter 12 — A Chart Is a Claim ─────────────────────────────────────
  - term: "aggregation"
    scan: true
    definition: >-
      A single summary value standing in for many underlying ones — a
      yearly total standing in for twelve months that moved very
      differently from each other, an average standing in for a curve that
      was actually flat and then jumped once.
    analogy: "One foot in the oven and one in the freezer, reported as a comfortable average."
    defined_in: 12

  # ─── Chapter 13 — Numbers You Can Trust ──────────────────────────────────
  - term: "chart of accounts"
    definition: >-
      The standard list of categories every transaction in a business gets
      sorted into — software subscriptions, payroll, travel, revenue by
      product line.
    analogy: "The labelled drawers every receipt gets filed into."
    defined_in: 13

  - term: "reconciliation"
    scan: true
    definition: >-
      Comparing a business's recorded transactions against an independent
      record of what actually happened — typically the bank or credit card
      statement — and confirming they match.
    analogy: "Checking the chequebook against the bank statement."
    depends_on: ["chart of accounts"]
    defined_in: 13
